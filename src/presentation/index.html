<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>Dasa Library — Quản lý thư viện</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Dasa Library trang tổng quan">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M8 9.5c4.5-1.3 8.5-.4 12 2.2 3.5-2.6 7.5-3.5 12-2.2v21c-4.5-1.3-8.5-.4-12 2.2-3.5-2.6-7.5-3.5-12-2.2z"/><path d="M20 12v20"/></svg>
        </span>
        <span><strong>Dasa Library</strong><small>QUẢN LÝ THƯ VIỆN</small></span>
      </a>

      <div class="nav-label">KHÔNG GIAN LÀM VIỆC</div>
      <nav class="main-nav" aria-label="Điều hướng chính">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span>Tổng quan</button>
        <button class="nav-item" data-page="books"><span class="nav-icon">▤</span>Kho sách</button>
        <button class="nav-item" data-page="members"><span class="nav-icon">♙</span>Thành viên</button>
        <button class="nav-item" data-page="loans"><span class="nav-icon">⇄</span>Mượn &amp; trả</button>
        <button class="nav-item" data-page="activity"><span class="nav-icon">◷</span>Lịch sử hoạt động</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="local-note"><span class="local-dot"></span><div><strong>Chạy cục bộ</strong><small>Dữ liệu nằm trên máy này</small></div></div>
        <div class="profile"><span class="profile-avatar">DL</span><div><strong>Thủ thư</strong><small>Quản trị viên</small></div><span class="profile-more">···</span></div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Mở menu">☰</button>
        <div class="page-heading"><div class="eyebrow">DASA LIBRARY / <span id="breadcrumb">TỔNG QUAN</span></div><h1 id="pageTitle">Tổng quan</h1></div>
        <div class="topbar-actions"><span class="connection"><span class="connection-dot"></span>Đang kết nối</span><button class="icon-button" id="refreshButton" title="Tải lại dữ liệu" aria-label="Tải lại dữ liệu">↻</button><button class="primary-button" data-action="quick-borrow"><span>＋</span> Tạo phiếu mượn</button></div>
      </header>
      <section class="content" id="content" aria-live="polite"><div class="loading-state"><span class="spinner"></span>Đang tải dữ liệu thư viện…</div></section>
      <footer class="footer"><span>Dasa Library Management</span><span id="lastUpdated">Dữ liệu cục bộ · localhost</span></footer>
    </main>
  </div>

  <dialog class="action-dialog" id="actionDialog">
    <form id="actionForm">
      <div class="dialog-header"><div><div class="eyebrow" id="dialogEyebrow">NGHIỆP VỤ</div><h2 id="dialogTitle"></h2></div><button type="button" class="dialog-close" id="dialogClose" aria-label="Đóng">×</button></div>
      <p class="dialog-description" id="dialogDescription"></p>
      <div class="dialog-fields" id="dialogFields"></div>
      <div class="dialog-actions"><button type="button" class="secondary-button" id="dialogCancel">Hủy</button><button type="submit" class="primary-button" id="dialogSubmit">Xác nhận</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
